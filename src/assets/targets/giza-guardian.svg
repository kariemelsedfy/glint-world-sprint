<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Sphinx sun medallion">
  <rect width="256" height="256" rx="18" fill="#22C4EA"/>
  <!-- medallion -->
  <circle cx="128" cy="128" r="104" fill="#FFD963" stroke="#211333" stroke-width="6"/>
  <circle cx="128" cy="128" r="90" fill="#F3B84B" stroke="#211333" stroke-width="4"/>
  <!-- sun rays inside medallion -->
  <g stroke="#FFF5E9" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <path d="M128 48 v12 M80 62 l7 10 M176 62 l-7 10 M52 100 l11 4 M204 100 l-11 4"/>
  </g>
  <!-- desert horizon -->
  <path d="M46 160 C90 150 160 152 210 160 L206 172 H50 Z" fill="#E9A23B" stroke="#211333" stroke-width="4" stroke-linejoin="round"/>
  <!-- sphinx body (lying lion) -->
  <path d="M88 160 C88 138 106 130 128 130 H176 C186 130 192 138 192 148 V160 Z" fill="#D89B5A" stroke="#211333" stroke-width="5" stroke-linejoin="round"/>
  <!-- front paws -->
  <rect x="150" y="150" width="46" height="12" rx="5" fill="#E7B36E" stroke="#211333" stroke-width="4"/>
  <rect x="150" y="156" width="46" height="8" rx="4" fill="#C98A48" stroke="#211333" stroke-width="3"/>
  <!-- head with nemes headdress -->
  <path d="M78 130 L72 74 H132 L126 130 Z" fill="#5B7FD6" stroke="#211333" stroke-width="5" stroke-linejoin="round"/>
  <path d="M84 74 H120 L124 86 H80 Z" fill="#FFD963" stroke="#211333" stroke-width="4"/>
  <!-- headdress stripes -->
  <path d="M80 96 H124 M82 110 H122" stroke="#FFD963" stroke-width="4"/>
  <!-- face -->
  <path d="M88 88 H116 V124 C116 132 106 136 102 136 C98 136 88 132 88 124 Z" fill="#E9BC96" stroke="#211333" stroke-width="5" stroke-linejoin="round"/>
  <path d="M94 102 h6 M104 102 h6" stroke="#211333" stroke-width="4" stroke-linecap="round"/>
  <path d="M96 122 q6 4 12 0" fill="none" stroke="#211333" stroke-width="3" stroke-linecap="round"/>
  <!-- false beard -->
  <rect x="98" y="134" width="8" height="14" rx="2" fill="#211333"/>
  <!-- medallion rim shine -->
  <path d="M60 80 A80 80 0 0 1 128 40" fill="none" stroke="#FFF5E9" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
</svg>
