<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Berlin TV Tower souvenir">
  <rect width="256" height="256" rx="18" fill="#F43FAB"/>
  <!-- night sky disc -->
  <circle cx="128" cy="124" r="100" fill="#7146C5" stroke="#211333" stroke-width="6"/>
  <!-- stars -->
  <g fill="#FFF5E9">
    <circle cx="70" cy="70" r="3"/>
    <circle cx="190" cy="60" r="2.5"/>
    <circle cx="60" cy="130" r="2"/>
    <circle cx="200" cy="140" r="3"/>
    <circle cx="176" cy="96" r="2"/>
  </g>
  <path d="M84 48 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" fill="#FFD963"/>
  <!-- ground / skyline -->
  <path d="M28 190 H228" stroke="#211333" stroke-width="6" stroke-linecap="round"/>
  <g fill="#B6A1E8" stroke="#211333" stroke-width="4">
    <rect x="46" y="160" width="26" height="30"/>
    <rect x="76" y="170" width="20" height="20"/>
    <rect x="164" y="166" width="22" height="24"/>
    <rect x="190" y="156" width="26" height="34"/>
  </g>
  <!-- base pavilion -->
  <path d="M104 190 L112 172 H144 L152 190 Z" fill="#E8DCC4" stroke="#211333" stroke-width="5" stroke-linejoin="round"/>
  <!-- shaft (tapering concrete) -->
  <path d="M120 172 L124 92 H132 L136 172 Z" fill="#E8DCC4" stroke="#211333" stroke-width="5" stroke-linejoin="round"/>
  <path d="M126 170 L128 96" stroke="#B9A88A" stroke-width="3"/>
  <!-- sphere -->
  <circle cx="128" cy="78" r="26" fill="#C9D6E2" stroke="#211333" stroke-width="6"/>
  <!-- sphere faceted highlights (the tiled steel look) -->
  <path d="M110 66 L146 66 M106 78 L150 78 M110 90 L146 90" stroke="#8FA4B8" stroke-width="3"/>
  <path d="M128 52 V104 M116 56 L140 100 M140 56 L116 100" stroke="#8FA4B8" stroke-width="3"/>
  <path d="M116 64 a14 14 0 0 1 12 -6" stroke="#FFF5E9" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- observation windows band -->
  <rect x="104" y="72" width="48" height="8" fill="#FFD963" stroke="#211333" stroke-width="3"/>
  <!-- antenna -->
  <path d="M126 52 L128 14 L130 52 Z" fill="#E4572E" stroke="#211333" stroke-width="4" stroke-linejoin="round"/>
  <path d="M120 40 H136 M122 30 H134" stroke="#211333" stroke-width="3"/>
  <circle cx="128" cy="12" r="5" fill="#F43FAB" stroke="#211333" stroke-width="3"/>
  <!-- souvenir plinth -->
  <rect x="84" y="196" width="88" height="20" rx="5" fill="#FFD963" stroke="#211333" stroke-width="5"/>
  <path d="M100 206 h56" stroke="#211333" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>
</svg>
