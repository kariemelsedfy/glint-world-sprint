<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Golden pyramidion capstone">
  <rect width="256" height="256" rx="18" fill="#7146C5"/>
  <!-- sun disc -->
  <circle cx="128" cy="96" r="70" fill="#F43FAB" opacity="0.35"/>
  <circle cx="128" cy="96" r="54" fill="#FFD963" stroke="#211333" stroke-width="6"/>
  <!-- rays -->
  <path d="M128 18 v14 M60 44 l10 10 M196 44 l-10 10 M46 96 h14 M210 96 h-14" stroke="#FFF5E9" stroke-width="6" stroke-linecap="round"/>
  <!-- sand -->
  <path d="M0 200 C60 184 120 196 256 186 V256 H0 Z" fill="#F3C877"/>
  <!-- pyramidion base pedestal -->
  <path d="M60 206 L196 206 L184 226 L72 226 Z" fill="#211333" opacity="0.35"/>
  <!-- pyramidion: left face (shaded) and right face (lit) -->
  <path d="M128 66 L48 204 H128 Z" fill="#D89B1E" stroke="#211333" stroke-width="6" stroke-linejoin="round"/>
  <path d="M128 66 L208 204 H128 Z" fill="#FFD963" stroke="#211333" stroke-width="6" stroke-linejoin="round"/>
  <!-- gold highlight facets -->
  <path d="M128 84 L160 150 L128 150 Z" fill="#FFF5E9" opacity="0.55"/>
  <!-- hieroglyph band -->
  <path d="M84 176 H172" stroke="#211333" stroke-width="4" stroke-linecap="round"/>
  <circle cx="104" cy="188" r="4" fill="#211333"/>
  <path d="M120 184 h12 M140 184 v8 M152 184 l8 8" stroke="#211333" stroke-width="4" stroke-linecap="round"/>
  <!-- glint -->
  <path d="M170 90 l0 16 M162 98 l16 0" stroke="#FFF5E9" stroke-width="6" stroke-linecap="round"/>
</svg>
