<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Golden Gate Bridge postcard">
  <rect width="256" height="256" rx="18" fill="#FFF5E9"/>
  <!-- postcard with tilted stamp corner -->
  <rect x="16" y="28" width="224" height="200" rx="8" fill="#22C4EA" stroke="#211333" stroke-width="6"/>
  <!-- sky gradient bands -->
  <rect x="22" y="34" width="212" height="60" fill="#7FDCF0"/>
  <!-- fog bank -->
  <path d="M22 150 C60 132 100 156 140 140 C180 124 210 148 234 136 V222 H22 Z" fill="#FFF5E9" opacity="0.85"/>
  <!-- water -->
  <path d="M22 186 C70 176 120 196 234 182 V222 H22 Z" fill="#1A8FB3"/>
  <path d="M40 200 h24 M110 206 h30 M180 198 h28" stroke="#FFF5E9" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <!-- main cables -->
  <path d="M22 60 L76 46 C104 110 152 110 180 46 L234 60" fill="none" stroke="#211333" stroke-width="8" stroke-linecap="round"/>
  <path d="M22 60 L76 46 C104 110 152 110 180 46 L234 60" fill="none" stroke="#E4572E" stroke-width="4" stroke-linecap="round"/>
  <!-- suspender cables -->
  <path d="M90 70 V130 M104 88 V130 M118 96 V130 M138 96 V130 M152 88 V130 M166 70 V130 M50 58 V130 M206 58 V130" stroke="#E4572E" stroke-width="3"/>
  <!-- deck -->
  <rect x="22" y="128" width="212" height="12" fill="#E4572E" stroke="#211333" stroke-width="5"/>
  <!-- towers -->
  <g fill="#E4572E" stroke="#211333" stroke-width="6" stroke-linejoin="round">
    <path d="M66 40 H86 L90 176 H62 Z"/>
    <path d="M170 40 H190 L194 176 H166 Z"/>
  </g>
  <!-- tower cross braces -->
  <g fill="#22C4EA" stroke="#211333" stroke-width="4">
    <rect x="70" y="56" width="12" height="14"/>
    <rect x="70" y="92" width="12" height="18"/>
    <rect x="174" y="56" width="12" height="14"/>
    <rect x="174" y="92" width="12" height="18"/>
  </g>
  <!-- tower lit faces -->
  <path d="M68 44 H74 L76 172 H66 Z M172 44 H178 L180 172 H170 Z" fill="#FF8A5B" opacity="0.8"/>
  <!-- postage stamp -->
  <rect x="184" y="36" width="44" height="40" fill="#FFD963" stroke="#211333" stroke-width="4" stroke-dasharray="5 4"/>
  <circle cx="206" cy="56" r="10" fill="#F43FAB" stroke="#211333" stroke-width="3"/>
  <!-- caption strip -->
  <rect x="22" y="204" width="212" height="18" fill="#FFF5E9" stroke="#211333" stroke-width="4"/>
  <path d="M40 213 h50 M104 213 h34 M152 213 h60" stroke="#7146C5" stroke-width="5" stroke-linecap="round"/>
</svg>
