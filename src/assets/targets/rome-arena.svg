<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Colosseum souvenir">
  <rect width="256" height="256" rx="18" fill="#F43FAB"/>
  <!-- sky disc -->
  <circle cx="128" cy="120" r="98" fill="#FFF5E9" stroke="#211333" stroke-width="6"/>
  <!-- ground -->
  <ellipse cx="128" cy="196" rx="96" ry="18" fill="#B6A1E8" stroke="#211333" stroke-width="5"/>
  <!-- colosseum outer wall: elliptical ring with broken top -->
  <path d="M40 150 C40 118 80 104 128 104 C176 104 216 118 216 150 V182 C216 200 176 210 128 210 C80 210 40 200 40 182 Z" fill="#E7B36E" stroke="#211333" stroke-width="6" stroke-linejoin="round"/>
  <!-- broken upper tier (left side higher) -->
  <path d="M40 150 C40 118 80 104 128 104 L124 76 C88 78 56 88 44 110 Z" fill="#F3C877" stroke="#211333" stroke-width="6" stroke-linejoin="round"/>
  <path d="M44 110 C56 90 88 78 124 76 L118 56 C84 60 58 72 46 92 Z" fill="#FFE3A8" stroke="#211333" stroke-width="6" stroke-linejoin="round"/>
  <!-- inner arena visible through top -->
  <path d="M96 118 C110 112 150 112 174 118 C196 124 204 134 200 144 C180 138 150 134 128 134 C106 134 86 138 76 144 C74 132 82 122 96 118 Z" fill="#C98A48" stroke="#211333" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="136" cy="140" rx="34" ry="8" fill="#F3C877" stroke="#211333" stroke-width="4"/>
  <!-- arches: bottom row -->
  <g fill="#7146C5" stroke="#211333" stroke-width="4">
    <path d="M56 200 v-20 a8 8 0 0 1 16 0 v20 Z"/>
    <path d="M84 206 v-22 a8 8 0 0 1 16 0 v22 Z"/>
    <path d="M114 208 v-22 a8 8 0 0 1 16 0 v22 Z"/>
    <path d="M144 208 v-22 a8 8 0 0 1 16 0 v22 Z"/>
    <path d="M174 204 v-22 a8 8 0 0 1 16 0 v22 Z"/>
  </g>
  <!-- arches: middle row -->
  <g fill="#7146C5" stroke="#211333" stroke-width="4">
    <path d="M60 170 v-16 a7 7 0 0 1 14 0 v16 Z"/>
    <path d="M86 166 v-18 a7 7 0 0 1 14 0 v18 Z"/>
    <path d="M114 164 v-18 a7 7 0 0 1 14 0 v18 Z"/>
    <path d="M144 164 v-18 a7 7 0 0 1 14 0 v18 Z"/>
    <path d="M172 168 v-18 a7 7 0 0 1 14 0 v18 Z"/>
  </g>
  <!-- arches: upper tier (left) -->
  <g fill="#7146C5" stroke="#211333" stroke-width="4">
    <path d="M62 104 v-14 a6 6 0 0 1 12 0 v14 Z"/>
    <path d="M86 96 v-14 a6 6 0 0 1 12 0 v14 Z"/>
    <path d="M56 130 v-10 a6 6 0 0 1 12 0 v10 Z"/>
  </g>
  <!-- ledge lines -->
  <path d="M42 176 C80 186 176 186 214 176" fill="none" stroke="#211333" stroke-width="4"/>
  <path d="M44 146 C80 156 176 156 212 146" fill="none" stroke="#211333" stroke-width="4"/>
</svg>
