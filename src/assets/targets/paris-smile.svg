<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Mona Lisa portrait">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FB7A6"/>
      <stop offset="1" stop-color="#4B6E5A"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="18" fill="#FFF5E9"/>
  <!-- ornate gilt frame -->
  <rect x="22" y="14" width="212" height="228" rx="10" fill="#C99A2E" stroke="#211333" stroke-width="6"/>
  <rect x="38" y="30" width="180" height="196" fill="#8A6215" stroke="#211333" stroke-width="4"/>
  <!-- landscape background -->
  <rect x="44" y="36" width="168" height="184" fill="url(#bg)"/>
  <path d="M44 150 C70 130 90 140 110 128 C140 112 160 134 212 120 V220 H44 Z" fill="#3E5A47"/>
  <path d="M44 176 C80 166 120 178 160 168 C180 163 196 170 212 166 V220 H44 Z" fill="#33483A"/>
  <!-- hair -->
  <path d="M84 118 C78 70 178 70 172 118 L178 210 H78 Z" fill="#3B2412" stroke="#211333" stroke-width="5"/>
  <!-- dress and shoulders -->
  <path d="M60 220 C64 180 96 166 128 166 C160 166 192 180 196 220 Z" fill="#3D2A1B" stroke="#211333" stroke-width="5"/>
  <!-- hands -->
  <path d="M86 214 C96 198 122 194 140 202 C158 196 176 200 182 214 Z" fill="#E9BC96" stroke="#211333" stroke-width="4"/>
  <!-- neck -->
  <path d="M112 150 H144 V176 C136 184 120 184 112 176 Z" fill="#E9BC96" stroke="#211333" stroke-width="4"/>
  <!-- face -->
  <path d="M94 104 C94 74 162 74 162 104 C162 132 150 158 128 158 C106 158 94 132 94 104 Z" fill="#F0C8A4" stroke="#211333" stroke-width="5"/>
  <!-- hair front strands -->
  <path d="M94 104 C90 86 100 78 112 80 C104 92 100 106 100 122 Z" fill="#3B2412"/>
  <path d="M162 104 C166 86 156 78 144 80 C152 92 156 106 156 122 Z" fill="#3B2412"/>
  <!-- veil -->
  <path d="M84 118 C90 84 166 84 172 118" fill="none" stroke="#7C7C86" stroke-width="3" opacity="0.7"/>
  <!-- eyes -->
  <ellipse cx="114" cy="110" rx="5" ry="3.5" fill="#211333"/>
  <ellipse cx="142" cy="110" rx="5" ry="3.5" fill="#211333"/>
  <path d="M106 104 q8 -5 16 0 M134 104 q8 -5 16 0" fill="none" stroke="#211333" stroke-width="3" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M128 116 q-4 12 3 16" fill="none" stroke="#B88463" stroke-width="3" stroke-linecap="round"/>
  <!-- the smile -->
  <path d="M114 140 q14 10 28 0" fill="none" stroke="#7A3B3B" stroke-width="4" stroke-linecap="round"/>
  <!-- cheek blush -->
  <circle cx="108" cy="128" r="6" fill="#F43FAB" opacity="0.25"/>
  <circle cx="148" cy="128" r="6" fill="#F43FAB" opacity="0.25"/>
  <!-- frame highlight -->
  <rect x="26" y="18" width="204" height="6" rx="3" fill="#FFE39B" opacity="0.8"/>
</svg>
