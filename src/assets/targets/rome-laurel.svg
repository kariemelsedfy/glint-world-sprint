  <path d="M128 214 C186 210 216 160 204 92" fill="none" stroke="#211333" stroke-width="12" stroke-linecap="round"/>
  <path d="M128 214 C70 210 40 160 52 92" fill="none" stroke="#C99A2E" stroke-width="6" stroke-linecap="round"/>
  <path d="M128 214 C186 210 216 160 204 92" fill="none" stroke="#C99A2E" stroke-width="6" stroke-linecap="round"/>
