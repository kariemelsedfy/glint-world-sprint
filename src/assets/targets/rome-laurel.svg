  <path d="M116 222 L104 240 M140 222 L152 240" stroke="#F43FAB" stroke-width="8" stroke-linecap="round"/>
  <path d="M116 222 L104 240 M140 222 L152 240" stroke="#211333" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
