    <path d="M108 190 C114 176 112 162 100 154 C92 166 96 182 108 190 Z" fill="#F3B84B"/>
    <path d="M84 172 C90 158 86 144 74 138 C68 150 72 166 84 172 Z" fill="#F3B84B"/>
    <path d="M70 140 C74 126 70 112 60 106 C54 118 58 132 70 140 Z" fill="#F3B84B"/>
  </g>
  <!-- leaves right (mirrored) -->
  <g fill="#FFD963" stroke="#211333" stroke-width="5" stroke-linejoin="round">
    <path d="M138 206 C152 196 156 182 148 170 C136 178 132 192 138 206 Z"/>
    <path d="M164 196 C178 188 184 174 178 162 C164 168 160 182 164 196 Z"/>
    <path d="M186 176 C198 166 202 152 196 140 C182 146 180 162 186 176 Z"/>
    <path d="M200 148 C210 138 212 122 204 112 C192 120 192 136 200 148 Z"/>
    <path d="M204 116 C210 104 208 88 198 80 C188 90 192 106 204 116 Z"/>
    <path d="M148 190 C142 176 144 162 156 154 C164 166 160 182 148 190 Z" fill="#F3B84B"/>
    <path d="M172 172 C166 158 170 144 182 138 C188 150 184 166 172 172 Z" fill="#F3B84B"/>
    <path d="M186 140 C182 126 186 112 196 106 C202 118 198 132 186 140 Z" fill="#F3B84B"/>
