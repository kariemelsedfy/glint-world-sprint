  <!-- sun disc held above head -->
  <circle cx="128" cy="38" r="12" fill="#F43FAB" stroke="#211333" stroke-width="5"/>
  <!-- hieroglyph nicks on plaque -->
  <path d="M60 60 h10 M186 60 h10 M60 200 h10 M186 200 h10" stroke="#211333" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
