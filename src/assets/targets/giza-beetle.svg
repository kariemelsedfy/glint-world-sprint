<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Blue scarab amulet">
  <rect width="256" height="256" rx="18" fill="#FFD963"/>
  <!-- amulet plaque -->
  <rect x="34" y="26" width="188" height="204" rx="28" fill="#F3B84B" stroke="#211333" stroke-width="6"/>
  <rect x="48" y="40" width="160" height="176" rx="20" fill="#E9A23B" stroke="#211333" stroke-width="3" opacity="0.9"/>
  <!-- legs -->
  <g stroke="#211333" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M96 104 L64 84 L52 96"/>
    <path d="M160 104 L192 84 L204 96"/>
    <path d="M92 134 L56 140 L46 156"/>
    <path d="M164 134 L200 140 L210 156"/>
    <path d="M100 166 L72 190 L74 206"/>
    <path d="M156 166 L184 190 L182 206"/>
  </g>
  <!-- abdomen / wing cases -->
  <path d="M128 100 C160 100 176 128 176 158 C176 186 154 206 128 206 C102 206 80 186 80 158 C80 128 96 100 128 100 Z" fill="#22C4EA" stroke="#211333" stroke-width="6"/>
  <path d="M128 104 V204" stroke="#211333" stroke-width="5"/>
  <!-- wing shine -->
  <path d="M100 130 C104 116 112 110 120 108" fill="none" stroke="#FFF5E9" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M150 128 C148 118 142 112 136 110" fill="none" stroke="#FFF5E9" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <!-- thorax -->
  <path d="M128 78 C150 78 160 92 158 106 C150 100 138 98 128 98 C118 98 106 100 98 106 C96 92 106 78 128 78 Z" fill="#1A8FB3" stroke="#211333" stroke-width="6"/>
  <!-- head -->
